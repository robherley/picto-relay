name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2

      # The server embeds the web client, so build it before compiling.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            bot/package-lock.json
      - name: Test and build the web client
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - name: Test the bot
        working-directory: bot
        run: |
          npm ci
          npm test

      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --workspace --all-features --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test firmware protocol (host C build)
        working-directory: firmware/esp32
        run: |
          mkdir -p build-host
          cc -std=gnu17 -Wall -Wextra -Werror -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            main/link.c main/client.c main/bridge.c test/test.c -o build-host/test
          ./build-host/test
